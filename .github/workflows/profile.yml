name: Render profile cards

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # STATS_TOKEN (optional) is a PAT with read:user; without it the public
      # workflow token is used, which only sees public data.
      - name: Render SVG cards
        run: node scripts/generate.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#9854f1&color_dots=#ebedf0,#c6d7f5,#8fb1ee,#5b8ae6,#2e7de9
            dist/snake-dark.svg?palette=github-dark&color_snake=#bb9af7&color_dots=#161b22,#253049,#3d5a99,#5b7fd1,#7aa2f7

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "Chore: Render profile cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
