<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="t d">
<title id="t">Portfolio</title>
<desc id="d">Meu portfólio em kenai.site: bilíngue, tema claro e escuro, feito sem framework. 2 estrelas.</desc>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; }
.fade-up { opacity: 0; animation: fade-up .6s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.shine { animation: shine 5s ease-in-out infinite; }
@keyframes shine { 0% { transform: translateX(-160px); } 60%, 100% { transform: translateX(640px); } }
.halo { animation: halo 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes halo { from { transform: scale(.85); opacity: .35; } to { transform: scale(1.15); opacity: .7; } }
.logo { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.3,1.5,.5,1) .05s forwards; }
@keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
.arrow { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; opacity: 1 !important; } }
</style>
<defs>
<clipPath id="edge"><rect width="480" height="220" rx="14"/></clipPath>
<clipPath id="logoClip"><rect x="24" y="26" width="76" height="76" rx="20"/></clipPath>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22d3c5"/><stop offset="1" stop-color="#22d3c5" stop-opacity=".7"/>
</linearGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter></defs>
<rect x=".5" y=".5" width="479" height="219" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g clip-path="url(#edge)">
  <circle cx="450" cy="10" r="90" fill="#22d3c5" opacity=".12" filter="url(#soft)"/>
  <rect width="480" height="4" fill="#22d3c5"/>
  <rect class="shine" x="0" width="140" height="4" fill="url(#sweep)" opacity=".7"/>
</g>
<circle class="halo" cx="62" cy="64" r="38" fill="#22d3c5" filter="url(#soft)"/>
<g class="logo"><image href="data:image/svg+xml;base64," x="24" y="26" width="76" height="76" clip-path="url(#logoClip)" preserveAspectRatio="xMidYMid meet"/></g>
<g class="fade-up" style="animation-delay:.1s">
  <text x="120" y="56" font-size="22" font-weight="800" fill="#1f2328">Portfolio</text>
  <path transform="translate(120 72) scale(0.875)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z" fill="#8c6c3e"/>
  <text x="140" y="84" font-size="13.5" font-weight="600" fill="#1f2328">2</text>
  <rect x="164" y="68" width="160" height="22" rx="11" fill="#b15c00" fill-opacity=".14"/>
  <path transform="translate(174 72) scale(0.8125)" d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.752 1.752 0 0 1 1 7.775Zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25ZM6 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z" fill="#b15c00"/>
  <text x="192" y="83" font-size="12" font-weight="600" fill="#b15c00">em desenvolvimento</text>
</g>
<g class="fade-up" style="animation-delay:.2s">
  <text x="24" y="128" font-size="15" fill="#59636e">Meu portfólio em kenai.site: bilíngue, tema claro e</text>
  <text x="24" y="150" font-size="15" fill="#59636e">escuro, feito sem framework.</text>
</g>
<g class="fade-up" style="animation-delay:.3s">
  <image href="data:image/svg+xml;base64," x="24" y="170" width="26" height="26"/>
<image href="data:image/svg+xml;base64," x="58" y="170" width="26" height="26"/>
<image href="data:image/svg+xml;base64," x="92" y="170" width="26" height="26"/>
  <text x="130" y="188" font-size="12" fill="#59636e">atualizado há 2 meses</text>
  <rect x="332" y="167" width="124" height="32" rx="16" fill="url(#cta)"/>
  <text x="350" y="188" font-size="13.5" font-weight="700" fill="#0d1117">Ver projeto</text>
  <path class="arrow" d="M430 178 l5 5 -5 5 M424 183 h10" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
