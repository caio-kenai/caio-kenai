<svg xmlns="http://www.w3.org/2000/svg" width="454" height="48" viewBox="0 0 454 48" role="img" aria-labelledby="t d">
<title id="t">frontend</title>
<desc id="d">nextjs, react, vue, angular, vite, tailwind, html, css</desc>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; }
.fade-up { opacity: 0; animation: fade-up .6s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.3,1.5,.5,1) forwards; }
@keyframes pop { from { opacity: 0; transform: scale(.5) translateY(6px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; opacity: 1 !important; } }
</style>
